<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>You're offline | QR Attendance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        line-height: 1.2;
      }
      button {
        min-height: 48px;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: white;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Connect to the internet to sign in, view attendance or scan a session QR code. Attendance cannot be submitted
        offline.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
