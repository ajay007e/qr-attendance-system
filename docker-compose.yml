services:
  mysql:
    image: mysql:8.4
    container_name: qr-attendance-mysql
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qr_attendance_system

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
